name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push pedidos
        uses: docker/build-push-action@v4
        with:
          context: ./pedidos
          push: true
          tags: fangzereda/pedidos:latest

      - name: Build e push pagamentos
        uses: docker/build-push-action@v4
        with:
          context: ./pagamentos
          push: true
          tags: fangzereda/pagamentos:latest

      - name: Build e push estoque
        uses: docker/build-push-action@v4
        with:
          context: ./estoque
          push: true
          tags: fangzereda/estoque:latest

      - name: Build e push api-gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          push: true
          tags: fangzereda/api-gateway:latest
